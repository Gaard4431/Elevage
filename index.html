<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrono & Élevage Dofus</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="widget-container">
        <div class="main-tabs">
            <button class="main-tab-btn active" onclick="switchMainTab('timer1')">Timer Sérénité</button>
            <button class="main-tab-btn" onclick="switchMainTab('timer2')">Timer Carac</button>
            <button class="main-tab-btn" onclick="switchMainTab('gen')">Élevage</button>
            <button class="main-tab-btn" onclick="switchMainTab('renta')">Renta Carburants</button>
        </div>

        <div id="tab-timer1" class="tab-content active">
            <div class="form-row">
                <label>Nom :</label>
                <div class="radio-group" id="t1_names">
                    <label><input type="radio" name="num1" value="1"> 1</label>
                    <label><input type="radio" name="num1" value="2"> 2</label>
                    <label><input type="radio" name="num1" value="3"> 3</label>
                    <label><input type="radio" name="num1" value="4"> 4</label>
                    <label><input type="radio" name="num1" value="5"> 5</label>
                    <label><input type="radio" name="num1" value="6"> 6</label>
                </div>
                <input type="text" id="lettre1" class="letter-box" value="A" maxlength="1">
            </div>
            <div class="form-row">
                <label>Valeur totale :</label>
                <input type="number" id="valeur1" placeholder="Ex: 8500">
                <label style="color: #d39e00; font-size:13px;"><input type="checkbox" id="visee2000" checked> Visée 2000</label>
            </div>
            <div class="form-row">
                <label>Perte / 10 sec :</label>
                <div class="radio-group" id="t1_pertes">
                    <label><input type="radio" name="perte1" value="10"> 10</label>
                    <label><input type="radio" name="perte1" value="20"> 20</label>
                    <label><input type="radio" name="perte1" value="30"> 30</label>
                    <label><input type="radio" name="perte1" value="40"> 40</label>
                </div>
            </div>
            <button class="btn-launch" onclick="addTimerSimple()">Lancer le chrono</button>
        </div>

        <div id="tab-timer2" class="tab-content">
            <div class="form-row">
                <label>Nom de l'enclos :</label>
                <div class="radio-group" id="t2_names">
                    <label><input type="radio" name="num2" value="1"> 1</label>
                    <label><input type="radio" name="num2" value="2"> 2</label>
                    <label><input type="radio" name="num2" value="3"> 3</label>
                    <label><input type="radio" name="num2" value="4"> 4</label>
                    <label><input type="radio" name="num2" value="5"> 5</label>
                    <label><input type="radio" name="num2" value="6"> 6</label>
                </div>
                <input type="text" id="lettre2" class="letter-box" value="A" maxlength="1">
            </div>

            <div class="double-timer-container">
                <div class="timer-box">
                    <h4>Statistique 1</h4>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:12px; font-weight:bold;">Valeur init:</span>
                        <input type="number" id="valA" placeholder="Ex: 500" style="width:65px;">
                    </div>
                    <div class="radio-group">
                        <label><input type="radio" name="perteA" value="10"> 10</label>
                        <label><input type="radio" name="perteA" value="20"> 20</label>
                        <label><input type="radio" name="perteA" value="30"> 30</label>
                        <label><input type="radio" name="perteA" value="40"> 40</label>
                    </div>
                    <div class="radio-group" style="margin-top:5px;">
                        <label style="color:#b38f00"><input type="radio" name="colA" value="Jaune" onchange="updateDoubleColors()"> Jaune</label>
                        <label style="color:#0056b3"><input type="radio" name="colA" value="Bleu" onchange="updateDoubleColors()"> Bleu</label>
                        <label style="color:#c82333"><input type="radio" name="colA" value="Rouge" onchange="updateDoubleColors()"> Rouge</label>
                        <label style="color:#218838"><input type="radio" name="colA" value="Vert" onchange="updateDoubleColors()"> Vert (XP)</label>
                    </div>
                </div>
                <div class="timer-box">
                    <h4>Statistique 2</h4>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:12px; font-weight:bold;">Valeur init:</span>
                        <input type="number" id="valB" placeholder="Ex: 500" style="width:65px;">
                    </div>
                    <div class="radio-group">
                        <label><input type="radio" name="perteB" value="10"> 10</label>
                        <label><input type="radio" name="perteB" value="20"> 20</label>
                        <label><input type="radio" name="perteB" value="30"> 30</label>
                        <label><input type="radio" name="perteB" value="40"> 40</label>
                    </div>
                    <div class="radio-group" style="margin-top:5px;">
                        <label style="color:#b38f00"><input type="radio" name="colB" value="Jaune" onchange="updateDoubleColors()"> Jaune</label>
                        <label style="color:#0056b3"><input type="radio" name="colB" value="Bleu" onchange="updateDoubleColors()"> Bleu</label>
                        <label style="color:#c82333"><input type="radio" name="colB" value="Rouge" onchange="updateDoubleColors()"> Rouge</label>
                        <label style="color:#218838"><input type="radio" name="colB" value="Vert" onchange="updateDoubleColors()"> Vert (XP)</label>
                    </div>
                </div>
            </div>
            <button class="btn-launch" onclick="addTimerDouble()">Lancer le chrono Carac</button>
        </div>

        <div id="tab-gen" class="tab-content">
            <div class="species-selector-row">
                <label><input type="radio" name="species" value="Muldo" checked onchange="changeSpecies()"> Muldos</label>
                <label><input type="radio" name="species" value="Dragodinde" onchange="changeSpecies()"> Dragodindes</label>
                <label><input type="radio" name="species" value="Volkorne" onchange="changeSpecies()"> Volkornes</label>
            </div>
            
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchSubTab('baby')">Obtenir un Bébé</button>
                <button class="sub-tab-btn" onclick="switchSubTab('parent')">Croiser un Parent</button>
                <button class="sub-tab-btn" onclick="switchSubTab('collection')">Collection G10</button>
                <button class="sub-tab-btn" onclick="switchSubTab('missing')">Manquants</button>
            </div>

            <div id="sub-tab-baby" class="sub-tab-content active">
                <div class="gen-selectors" id="gen-buttons-baby"></div>
                <div id="color-results-baby" class="color-grid" style="max-height: 250px; overflow-y:auto; padding-right:5px;"></div>
            </div>
            <div id="sub-tab-parent" class="sub-tab-content">
                <div class="gen-selectors" id="gen-buttons-parent"></div>
                <div id="color-results-parent" class="color-grid" style="max-height: 250px; overflow-y:auto; padding-right:5px;"></div>
            </div>
            <div id="sub-tab-collection" class="sub-tab-content">
                <div id="collection-container" style="max-height: 300px; overflow-y: auto; padding-right: 5px;"></div>
            </div>
            <div id="sub-tab-missing" class="sub-tab-content">
                <div id="missing-container" style="max-height: 300px; overflow-y: auto; padding-right: 5px;"></div>
            </div>
        </div>

        <div id="tab-renta" class="tab-content">
            <div class="renta-fuel-group">
                <label><input type="radio" name="r_fuel" value="baffe" class="renta-fuel-radio" checked onchange="renderRentaTable()"> <div class="renta-fuel-label" style="background:#4A4A4A;">Baffe</div></label>
                <label><input type="radio" name="r_fuel" value="caresse" class="renta-fuel-radio" onchange="renderRentaTable()"> <div class="renta-fuel-label" style="background:#FF69B4;">Caresses</div></label>
                <label><input type="radio" name="r_fuel" value="foudre" class="renta-fuel-radio" onchange="renderRentaTable()"> <div class="renta-fuel-label" style="background:#D4AF37; color:#000;">Foudre</div></label>
                <label><input type="radio" name="r_fuel" value="abreuvoir" class="renta-fuel-radio" onchange="renderRentaTable()"> <div class="renta-fuel-label" style="background:#0056b3;">Abreuvoir</div></label>
                <label><input type="radio" name="r_fuel" value="dragofesse" class="renta-fuel-radio" onchange="renderRentaTable()"> <div class="renta-fuel-label" style="background:#c82333;">Dragofesse</div></label>
                <label><input type="radio" name="r_fuel" value="mangeoire" class="renta-fuel-radio" onchange="renderRentaTable()"> <div class="renta-fuel-label" style="background:#28a745;">Mangeoire</div></label>
            </div>

            <div class="renta-tier-group">
                <label><input type="radio" name="r_tier" value="T1" class="renta-tier-radio" checked onchange="renderRentaTable()"> <div class="renta-tier-label">Tier 1</div></label>
                <label><input type="radio" name="r_tier" value="T2" class="renta-tier-radio" onchange="renderRentaTable()"> <div class="renta-tier-label">Tier 2</div></label>
                <label><input type="radio" name="r_tier" value="T3" class="renta-tier-radio" onchange="renderRentaTable()"> <div class="renta-tier-label">Tier 3</div></label>
                <label><input type="radio" name="r_tier" value="T4" class="renta-tier-radio" onchange="renderRentaTable()"> <div class="renta-tier-label">Tier 4</div></label>
            </div>

            <table class="renta-table">
                <thead>
                    <tr>
                        <th id="renta-header-taille" class="renta-color-header" style="width: 35%;">Taille (Capacité)</th>
                        <th id="renta-header-prix" class="renta-color-header">Prix Unitaire</th>
                        <th id="renta-header-ratio" class="renta-color-header">Prix / 20 000</th>
                    </tr>
                </thead>
                <tbody id="renta-tbody">
                    </tbody>
            </table>

            <div class="compare-box">
                <h4 style="margin:0 0 10px 0; font-size:14px; color:#444;">Comparer avec d'autres Tiers :</h4>
                <div class="compare-checkboxes" id="compare-checkboxes"></div>
                <div id="compare-result" class="compare-result" style="display: none;"></div>
            </div>
        </div>

        <hr style="width:100%; border:1px solid #ddd; margin: 20px 0 10px 0;">
        <h3 style="margin:0 0 10px 0; font-size:16px; color:#555;">Chronos en cours :</h3>
        <div id="list"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">...</h3>
                <div id="modal-highlight" class="color-pill no-hover baby-result"></div>
            </div>
            <h4 id="modal-subtitle" style="margin: 0 0 10px 0; font-size: 14px; text-align: center; color: #444;">...</h4>
            <div class="couples-list" id="modal-list"></div>
            <button class="modal-close" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
